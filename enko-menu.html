    <style>
:root {
  color-scheme: light;
  --navy: #10263d;
  --navy-soft: #263d52;
  --ink: #1f2932;
  --muted: #77766f;
  --paper: #f4efe7;
  --card: #fffdf8;
  --line: #e6ded2;
  --wood: #9a7858;
  --wood-light: #c9ad8b;
  --serif: Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-family: var(--sans);
  color: var(--ink);
  background: var(--paper);
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { min-width: 320px; margin: 0; background: var(--paper); }
a { color: inherit; }
button { font: inherit; }

.skip-link {
  position: absolute;
  z-index: 10;
  top: 0.75rem;
  left: 0.75rem;
  padding: 0.7rem 1rem;
  transform: translateY(-160%);
  border-radius: 0.5rem;
  background: var(--card);
  color: var(--navy);
}
.skip-link:focus { transform: translateY(0); }

.hero {
  overflow: hidden;
  background-color: var(--navy);
  background-image: radial-gradient(ellipse at 78% 6%, rgba(201, 173, 139, 0.12), transparent 34%),
    linear-gradient(120deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  color: #f7f1e8;
}
.hero-inner {
  position: relative;
  display: flex;
  align-items: center;
  gap: clamp(1.2rem, 4vw, 2.5rem);
  width: min(100% - 2.5rem, 1050px);
  min-height: 254px;
  margin-inline: auto;
  padding-block: 2.5rem;
}
.brand-mark {
  flex: 0 0 auto;
  width: clamp(104px, 15vw, 148px);
  height: clamp(104px, 15vw, 148px);
  border: 3px solid rgba(247, 241, 232, 0.75);
  border-radius: 50%;
  object-fit: cover;
  box-shadow: 0 0 0 7px rgba(247, 241, 232, 0.08);
}
.hero-copy { min-width: 0; }
.eyebrow {
  margin: 0;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.19em;
  line-height: 1.5;
  text-transform: uppercase;
}
.hero-eyebrow { color: var(--wood-light); }
h1 {
  margin: 0.45rem 0 0;
  font-family: var(--serif);
  font-size: clamp(2.4rem, 5vw, 4.2rem);
  font-weight: 500;
  letter-spacing: -0.055em;
  line-height: 0.98;
}
.mobile-break { display: none; }
.hero-note { margin: 0.9rem 0 0; color: rgba(247, 241, 232, 0.76); font-size: 0.95rem; }
.hero-aside {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  margin-left: auto;
  color: rgba(247, 241, 232, 0.7);
  font-family: var(--serif);
  font-size: 0.68rem;
  letter-spacing: 0.13em;
  line-height: 1.5;
  text-align: right;
}
.aside-rule { width: 2.8rem; height: 1px; background: var(--wood-light); }

.page-shell { width: min(100% - 2.5rem, 790px); margin: 0 auto; padding: 2.8rem 0 2rem; }
.menu-intro { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: 1.55rem; }
.intro-eyebrow { margin-bottom: 0.35rem; color: var(--wood); }
.menu-intro h2 { margin: 0; color: var(--navy); font-family: var(--serif); font-size: clamp(2.15rem, 5vw, 2.8rem); font-weight: 500; letter-spacing: -0.04em; }
.share-button {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  min-height: 42px;
  padding: 0.55rem 0.9rem;
  border: 1px solid #d9cdbd;
  border-radius: 999px;
  background: transparent;
  color: var(--navy);
  cursor: pointer;
  font-size: 0.8rem;
  font-weight: 650;
  transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
}
.share-button:hover { transform: translateY(-1px); border-color: var(--wood); background: rgba(255,255,255,0.55); }
.share-button:focus-visible, .category-nav a:focus-visible { outline: 3px solid var(--wood); outline-offset: 3px; }
.share-button svg { width: 17px; height: 17px; }
.category-nav {
  position: sticky;
  z-index: 3;
  top: 0.5rem;
  display: flex;
  gap: 0.5rem;
  width: fit-content;
  max-width: 100%;
  margin: 0 0 1.35rem;
  padding: 0.35rem;
  overflow-x: auto;
  border: 1px solid rgba(230, 222, 210, 0.9);
  border-radius: 999px;
  background: rgba(255, 253, 248, 0.94);
  box-shadow: 0 5px 18px rgba(16, 38, 61, 0.05);
  scrollbar-width: none;
  backdrop-filter: blur(12px);
}
.category-nav::-webkit-scrollbar { display: none; }
.category-nav a {
  flex: 0 0 auto;
  padding: 0.62rem 0.9rem;
  border-radius: 999px;
  color: var(--navy-soft);
  font-size: 0.78rem;
  font-weight: 650;
  text-decoration: none;
  transition: background-color 160ms ease, color 160ms ease;
}
.category-nav a:hover { background: var(--navy); color: #fffaf3; }
.menu-sections { display: grid; gap: 1.05rem; }
.menu-card {
  scroll-margin-top: 5.5rem;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--card);
  box-shadow: 0 8px 24px rgba(44, 37, 29, 0.035);
}
.section-heading {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 1rem;
  padding: 1.2rem 1.35rem 0.95rem;
  border-bottom: 1px solid var(--line);
}
.section-number { display: block; margin-bottom: 0.25rem; color: var(--wood); font-size: 0.65rem; font-weight: 750; letter-spacing: 0.15em; }
.section-heading h3 { margin: 0; color: var(--navy); font-family: var(--serif); font-size: 1.4rem; font-weight: 500; }
.section-heading p { margin: 0 0 0.1rem; color: var(--muted); font-size: 0.75rem; text-align: right; }
.menu-list { margin: 0; padding: 0.3rem 1.35rem 0.75rem; list-style: none; }
.menu-item {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1.25rem;
  padding: 0.76rem 0;
  border-bottom: 1px dashed #e9e2d9;
}
.menu-item:last-child { border-bottom: 0; }
.item-name { color: #29313a; font-size: 0.94rem; font-weight: 580; line-height: 1.35; }
.item-unit { margin-left: 0.38rem; color: var(--muted); font-size: 0.76rem; font-weight: 450; }
.item-price { flex: 0 0 auto; color: var(--navy); font-size: 0.94rem; font-variant-numeric: tabular-nums; font-weight: 750; white-space: nowrap; }
.share-status { min-height: 1.25em; margin: 0.7rem 0 0; color: var(--navy-soft); font-size: 0.8rem; text-align: right; }
.complimentary-note {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  margin-top: 1.45rem;
  padding: 1.1rem 1rem;
  border: 1px solid rgba(154, 120, 88, 0.26);
  border-radius: 12px;
  background: rgba(255, 253, 248, 0.55);
  color: var(--navy);
}
.complimentary-note p { margin: 0; font-family: var(--serif); font-size: 1rem; }
.note-star { color: var(--wood); font-size: 1rem; }
.site-footer {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.55rem;
  padding: 1.4rem 1rem 1.8rem;
  color: #7a7771;

<script>
// Fiyat güncellemesi için bu dosyadaki ilgili `price` değerini değiştirin.
// Örnek: meze fiyatı 150 TL'den 160 TL'ye çıkarsa price: 150 -> price: 160.
const menuSections = [
  {
    id: "biralar",
    title: "Biralar",
    eyebrow: "Soğuk servis",
    items: [
      { name: "Efe Şişe & Kutu Bira", price: 130 },
      { name: "Fıçı Bira", price: 120 },
      { name: "Özel Seri Biralar", price: 150 },
    ],
  },
  {
    id: "soframiz",
    title: "Soframızdan",
    eyebrow: "Paylaşmalıklar & sıcaklar",
    items: [
      { name: "Meze Çeşitleri", unit: "Porsiyon", price: 150 },
      { name: "Çerez", unit: "Porsiyon", price: 150 },
      { name: "Peynir Tabağı", unit: "Porsiyon", price: 150 },
      { name: "Arnavut Ciğeri", unit: "Porsiyon", price: 400 },
      { name: "Tavuk Sote", unit: "Porsiyon", price: 350 },
      { name: "Et Sote", unit: "Porsiyon", price: 800 },
      { name: "Sucuk", unit: "Porsiyon", price: 280 },
      { name: "Makarna", price: 80 },
    ],
  },
  {
    id: "raki",
    title: "Rakı",
    eyebrow: "Markasına ve cl ölçüsüne göre",
    items: [
      { name: "Beylerbeyi Göbek", unit: "35 cl", price: 1700 },
      { name: "Beylerbeyi Göbek", unit: "50 cl", price: 2200 },
      { name: "Beylerbeyi Göbek", unit: "70 cl", price: 2700 },
      { name: "Beylerbeyi Göbek", unit: "100 cl", price: 3000 },
      { name: "Efe Gold", unit: "20 cl", price: 800 },
      { name: "Efe Gold", unit: "35 cl", price: 1500 },
      { name: "Efe Gold", unit: "50 cl", price: 2000 },
      { name: "Efe Gold", unit: "70 cl", price: 2400 },
      { name: "Tekirdağ Altın Seri", unit: "35 cl", price: 1500 },
      { name: "Tekirdağ Altın Seri", unit: "50 cl", price: 2000 },
      { name: "Tekirdağ Altın Seri", unit: "70 cl", price: 2400 },
      { name: "Yeni Rakı", unit: "20 cl", price: 750 },
      { name: "Yeni Rakı", unit: "35 cl", price: 1400 },
      { name: "Yeni Rakı", unit: "50 cl", price: 1750 },
      { name: "Yeni Rakı", unit: "70 cl", price: 2100 },
    ],
  },
];

const listHost = document.querySelector("#menuSections");
const money = new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 0 });

for (const [index, section] of menuSections.entries()) {
  const card = document.createElement("section");
  card.className = "menu-card";
  card.id = section.id;
  card.setAttribute("aria-labelledby", `${section.id}-title`);

  const heading = document.createElement("div");
  heading.className = "section-heading";
  const titleBlock = document.createElement("div");
  const number = document.createElement("span");
  number.className = "section-number";
  number.textContent = `0${index + 1}`;
  const title = document.createElement("h3");
  title.id = `${section.id}-title`;
  title.textContent = section.title;
  titleBlock.append(number, title);
  const subtitle = document.createElement("p");
  subtitle.textContent = section.eyebrow;
  heading.append(titleBlock, subtitle);

  const list = document.createElement("ul");
  list.className = "menu-list";
  for (const item of section.items) {
    const row = document.createElement("li");
    row.className = "menu-item";
    const name = document.createElement("span");
    name.className = "item-name";
    name.append(document.createTextNode(item.name));
    if (item.unit) {
      const unit = document.createElement("span");
      unit.className = "item-unit";
      unit.textContent = item.unit;
      name.append(unit);
    }
    const price = document.createElement("span");
    price.className = "item-price";
    price.textContent = `${money.format(item.price)} TL`;
    row.append(name, price);
    list.append(row);
  }
  card.append(heading, list);
  listHost.append(card);
}

const shareButton = document.querySelector("#shareMenu");
const shareStatus = document.querySelector("#shareStatus");
shareButton.addEventListener("click", async () => {
  const shareData = {
    title: "Enko’nun Yeri — Menü",
    text: "Enko’nun Yeri güncel menüsüne göz at.",
    url: window.location.href,
  };
  try {
    if (navigator.share) {
      await navigator.share(shareData);
      shareStatus.textContent = "Menü bağlantısı paylaşıldı.";
    } else if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(shareData.url);
      shareStatus.textContent = "Menü bağlantısı panoya kopyalandı.";
    } else {
      shareStatus.textContent = `Menü bağlantısı: ${shareData.url}`;
    }
  } catch (error) {
    if (error?.name !== "AbortError") {
      shareStatus.textContent = "Bağlantı paylaşılırken bir sorun oluştu.";
    }
  }
});

</script>
